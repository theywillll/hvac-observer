<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3a766c"/></marker></defs><rect width="1200" height="650" fill="#f5f7f0"/><style>text{font-family:Arial,sans-serif;fill:#163e3c}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#60766c}.box{fill:#fff;stroke:#b5cabc;stroke-width:2}.line{fill:none;stroke:#3a766c;stroke-width:2;marker-end:url(#arrow)}.label{font-size:16px}.small{font-size:13px}</style><text x="40" y="48" class="title">HVAC Observer · Reference circuit schematic</text><text x="40" y="77" class="sub">Functional connections and design values; final layout, ratings and protection require engineering review</text><rect x="40" y="120" width="470" height="165" rx="12" class="box"/><text x="58" y="149" class="label" font-weight="bold">A · Isolated thermostat channel (repeat ×7)</text><text x="58" y="176" class="small">X ─ fuse ─ 1.5k / 0.5W ─ H11AA1 AC LED</text><text x="58" y="198" class="small">C ───────── 1.5k / 0.5W ─ other LED pin</text><text x="58" y="220" class="small">FIELD SIDE: 18–30 VAC design envelope</text><text x="58" y="242" class="small">C never connects to electronics ground</text><rect x="665" y="120" width="485" height="165" rx="12" class="box"/><text x="683" y="149" class="label" font-weight="bold">SELV output side</text><text x="683" y="176" class="small">3.3 V ─ 10k ─ collector ─ 1k ─ GPIO</text><text x="683" y="198" class="small">Emitter → electronics GND; base open</text><text x="683" y="220" class="small">GPIO → 10nF → electronics GND</text><text x="683" y="242" class="small">Active-low half-cycle pulses latched in firmware</text><path d="M588 115V300" stroke="#be8847" stroke-width="4" stroke-dasharray="8 7"/><text x="528" y="320" class="small">ISOLATION BARRIER</text><path d="M510 205L665 205" class="line"/><rect x="40" y="355" width="535" height="225" rx="12" class="box"/><text x="58" y="384" class="label" font-weight="bold">B · Voltage-output CT / optional acquisition</text><text x="58" y="411" class="small">CT low → buffered 1.65 V bias</text><text x="58" y="433" class="small">CT high → 1k → protected ADC input A0 / A1 / A2</text><text x="58" y="455" class="small">ADC → 100nF → bias; add low-leakage rail clamps</text><text x="58" y="477" class="small">Bias: 3.3V → 10k / 10k divider → MCP6002 buffer</text><text x="58" y="499" class="small">0.333 Vrms @ rated current; internal CT burden</text><text x="58" y="521" class="small">High-rate timing / anti-alias qualification required</text><rect x="615" y="355" width="535" height="225" rx="12" class="box"/><text x="633" y="384" class="label" font-weight="bold">C · Environmental I2C / implemented</text><text x="633" y="411" class="small">3.3 V rail → sensor VDD; GND → sensor GND</text><text x="633" y="433" class="small">SDA / SCL → 4.7k pullups to 3.3 V (effective)</text><text x="633" y="455" class="small">SHT31 return 0x44; supply 0x45 (ADDR high)</text><text x="633" y="477" class="small">SDP810 0x25; pressure taps either side of filter</text><text x="633" y="499" class="small">100nF at each VDD; 10µF local rail bypass</text><text x="633" y="521" class="small">No mains divider; no direct R/C-to-GPIO wiring</text><text x="40" y="626" class="small">REFERENCE DESIGN · Passive sensing only · Not a certified PCB · See hardware/README.md and docs/safety.md</text></svg>
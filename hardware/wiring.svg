<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3a766c"/></marker></defs><rect width="1200" height="690" fill="#f5f7f0"/><style>text{font-family:Arial,sans-serif;fill:#163e3c}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#60766c}.box{fill:#fff;stroke:#b5cabc;stroke-width:2}.line{fill:none;stroke:#3a766c;stroke-width:2;marker-end:url(#arrow)}.label{font-size:16px}.small{font-size:13px}</style><text x="40" y="48" class="title">HVAC Observer · Wiring and installation map</text><text x="40" y="77" class="sub">Pinout.csv is the complete connector/function assignment; this map shows placement and domain boundaries</text><rect x="40" y="125" width="340" height="375" rx="12" class="box"/><text x="58" y="154" class="label" font-weight="bold">HVAC / sensor location</text><text x="58" y="181" class="small">Return air: SHT31 0x44</text><text x="58" y="203" class="small">Supply air: SHT31 0x45</text><text x="58" y="225" class="small">Before filter → pressure high port</text><text x="58" y="247" class="small">After filter → pressure low port</text><text x="58" y="269" class="small">24-V terminals → opto input board</text><text x="58" y="291" class="small">Independent pan float → contact</text><text x="58" y="313" class="small">Outdoor / line probes → remote node</text><text x="58" y="335" class="small">Mains compartments: professionals only</text><text x="58" y="357" class="small">Never connect factory safeties in parallel</text><rect x="520" y="125" width="270" height="375" rx="12" class="box"/><text x="538" y="154" class="label" font-weight="bold">UNO Q connections</text><text x="538" y="181" class="small">SDA / SCL designated pins</text><text x="538" y="203" class="small">3.3 V + electronics GND</text><text x="538" y="225" class="small">D2: isolated R status</text><text x="538" y="247" class="small">D3 / D4: isolated Y / Y2</text><text x="538" y="269" class="small">D5 / D6: isolated W / W2</text><text x="538" y="291" class="small">D7: isolated G</text><text x="538" y="313" class="small">D8: isolated O/B</text><text x="538" y="335" class="small">D9: independent float</text><text x="538" y="357" class="small">A0–A2: future conditioned CTs</text><rect x="870" y="125" width="280" height="175" rx="12" class="box"/><text x="888" y="154" class="label" font-weight="bold">Linux / network</text><text x="888" y="181" class="small">Onboard Bridge snapshots</text><text x="888" y="203" class="small">Local Python service + SQLite</text><text x="888" y="225" class="small">Browser: localhost:8765</text><text x="888" y="247" class="small">Remote nodes: gateway adapter</text><path d="M380 225L520 225" class="line"/><text x="458.0" y="215.0" class="small">Short I2C</text><path d="M380 360L520 360" class="line"/><text x="458.0" y="350.0" class="small">Isolated I/O</text><path d="M790 210L870 210" class="line"/><rect x="870" y="345" width="280" height="155" rx="12" class="box"/><text x="888" y="374" class="label" font-weight="bold">Pi-only alternative</text><text x="888" y="401" class="small">Physical 1: 3.3 V; 6: GND</text><text x="888" y="423" class="small">Physical 3: SDA (GPIO2)</text><text x="888" y="445" class="small">Physical 5: SCL (GPIO3)</text><text x="888" y="467" class="small">Use only one I2C host</text><rect x="40" y="535" width="1110" height="90" rx="12" class="box"/><text x="58" y="564" class="label" font-weight="bold">Cable boundary</text><text x="58" y="591" class="small">Keep the local I2C harness short. Use qualified extenders or remote nodes for separated ducts/outdoor locations.</text><text x="40" y="666" class="small">REFERENCE DESIGN · Passive sensing only · Not a certified PCB · See hardware/README.md and docs/safety.md</text></svg>
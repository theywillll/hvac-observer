<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3a766c"/></marker></defs><rect width="1200" height="690" fill="#f5f7f0"/><style>text{font-family:Arial,sans-serif;fill:#163e3c}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#60766c}.box{fill:#fff;stroke:#b5cabc;stroke-width:2}.line{fill:none;stroke:#3a766c;stroke-width:2;marker-end:url(#arrow)}.label{font-size:16px}.small{font-size:13px}</style><text x="40" y="48" class="title">HVAC Observer · System architecture</text><text x="40" y="77" class="sub">Implemented environmental path with clearly separated expansion interfaces</text><rect x="40" y="130" width="310" height="125" rx="12" class="box"/><text x="58" y="159" class="label" font-weight="bold">Safe environmental sensors</text><text x="58" y="186" class="small">Supply / return SHT31 + SDP810</text><text x="58" y="208" class="small">Independent condensate contact</text><text x="58" y="230" class="small">Short local 3.3-V bus</text><rect x="40" y="290" width="310" height="125" rx="12" class="box"/><text x="58" y="319" class="label" font-weight="bold">HVAC field signals</text><text x="58" y="346" class="small">24 VAC demand → optical isolation</text><text x="58" y="368" class="small">CT → isolated secondary → conditioning</text><text x="58" y="390" class="small">Meter → network (professional install)</text><rect x="435" y="130" width="320" height="160" rx="12" class="box"/><text x="453" y="159" class="label" font-weight="bold">UNO Q / MCU</text><text x="453" y="186" class="small">CRC checks; nullable measurements</text><text x="453" y="208" class="small">0.5-Hz environmental acquisition</text><text x="453" y="230" class="small">Cached snapshot; no actuator output</text><text x="453" y="252" class="small">Optional waveform tasks: separate</text><rect x="435" y="360" width="320" height="150" rx="12" class="box"/><text x="453" y="389" class="label" font-weight="bold">UNO Q / Linux</text><text x="453" y="416" class="small">Validation → features → rules</text><text x="453" y="438" class="small">Reviewed baselines → SQLite</text><text x="453" y="460" class="small">Local read-only API</text><rect x="840" y="360" width="310" height="150" rx="12" class="box"/><text x="858" y="389" class="label" font-weight="bold">Browser dashboard</text><text x="858" y="416" class="small">Health + coverage / stale status</text><text x="858" y="438" class="small">Historical measurements</text><text x="858" y="460" class="small">Evidence and suggested next steps</text><rect x="840" y="130" width="310" height="130" rx="12" class="box"/><text x="858" y="159" class="label" font-weight="bold">Approved isolated supply</text><text x="858" y="186" class="small">USB-C → UNO Q</text><text x="858" y="208" class="small">Protected accessory sensor rail</text><text x="858" y="230" class="small">No HVAC transformer power</text><path d="M350 195L435 195" class="line"/><path d="M350 350L435 260" class="line"/><path d="M595 290L595 360" class="line"/><text x="603.0" y="315.0" class="small">Bridge</text><path d="M755 440L840 440" class="line"/><path d="M840 190L755 190" class="line"/><rect x="40" y="540" width="1110" height="90" rx="12" class="box"/><text x="58" y="569" class="label" font-weight="bold">Optional Pi architecture</text><text x="58" y="596" class="small">Pi-only: dual SHT31 adapter + external sensors. Hybrid: Pi aggregates UNO Q nodes over network; no long GPIO cable.</text><text x="40" y="666" class="small">REFERENCE DESIGN · Passive sensing only · Not a certified PCB · See hardware/README.md and docs/safety.md</text></svg>